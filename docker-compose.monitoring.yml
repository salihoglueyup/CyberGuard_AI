version: "3.9"

# CyberGuard AI - Monitoring Stack
# Prometheus + Grafana + Node Exporter
#
# Başlatmak için:
#   docker compose -f docker-compose.monitoring.yml up -d
#
# Grafana:    http://localhost:3001  (admin / cyberguard2026)
# Prometheus: http://localhost:9090

services:
  # ─────────────────────────────────────────
  # Prometheus — metrik toplayıcı
  # ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: cyberguard_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - monitoring

  # ─────────────────────────────────────────
  # Grafana — görselleştirme
  # ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: cyberguard_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: cyberguard2026
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - monitoring

  # ─────────────────────────────────────────
  # Node Exporter — sistem metrikleri (CPU, RAM, Disk)
  # ─────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: cyberguard_node_exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge
