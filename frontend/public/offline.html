<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberGuard AI — Offline</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #060a14;
            color: #8899aa;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 420px;
        }
        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            border: 2px solid #00e5ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s ease-in-out infinite;
        }
        .icon svg { width: 40px; height: 40px; stroke: #00e5ff; fill: none; stroke-width: 1.5; }
        @keyframes pulse { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
        h1 {
            font-size: 14px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #00e5ff;
            margin-bottom: 1rem;
        }
        p { font-size: 12px; line-height: 1.6; margin-bottom: 1.5rem; }
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border: 1px solid rgba(0, 229, 255, 0.2);
            border-radius: 4px;
            font-size: 10px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ff003c;
            animation: blink 1s ease-in-out infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .retry {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 10px 24px;
            background: rgba(0, 229, 255, 0.08);
            border: 1px solid rgba(0, 229, 255, 0.3);
            color: #00e5ff;
            font-family: inherit;
            font-size: 11px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .retry:hover { background: rgba(0, 229, 255, 0.15); border-color: #00e5ff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <svg viewBox="0 0 24 24"><path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.56 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h1>Baglanti Kesildi</h1>
        <p>CyberGuard AI sunucusuna erisilemedi. Internet baglantinizi kontrol edin ve tekrar deneyin.</p>
        <div class="status">
            <span class="dot"></span>
            OFFLINE MODE
        </div>
        <br />
        <button class="retry" onclick="window.location.reload()">Yeniden Dene</button>
    </div>
</body>
</html>
