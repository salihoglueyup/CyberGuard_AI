[project]
name = "cyberguard-ai"
version = "2.0.0"
description = "AI-powered Cyber Security Platform"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["app*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/__pycache__/*", "*/migrations/*"]

[tool.coverage.report]
fail_under = 35
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".venv",
    "__pycache__",
    "*.pyc",
    "model_artifacts",
    "scripts/archived",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in default args (FastAPI pattern)
    "B904",  # raise from inside except (many existing raises without from)
]

[tool.ruff.lint.isort]
known-first-party = ["app", "src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "scripts/",
    "model_artifacts/",
    ".venv/",
]
