name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # Python Backend: lint + test
  # ─────────────────────────────────────────
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pip-audit

      - name: Lint with ruff
        run: ruff check app/ src/ tests/

      - name: Dependency vulnerability audit (OWASP A06)
        run: pip-audit --ignore-vuln GHSA-jfh8-c2jp-5 -f json -o pip-audit-report.json || true

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report-py${{ matrix.python-version }}
          path: pip-audit-report.json

      - name: Run tests with coverage
        env:
          ADMIN_DEFAULT_PASSWORD: test-ci-password-123
          CORS_ORIGINS: http://localhost:5173
        run: pytest tests/ --cov=app --cov=src --cov-report=term-missing --cov-report=xml -x

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ─────────────────────────────────────────
  # Frontend: lint + test + build
  # ─────────────────────────────────────────
  frontend:
    name: Frontend (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build

  # ─────────────────────────────────────────
  # Docker Build (main branch only)
  # ─────────────────────────────────────────
  docker:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: cyberguard-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
